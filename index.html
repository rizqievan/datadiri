<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cyber Hardware Mode</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family: 'Segoe UI', sans-serif;
}

body{
  background:#050505;
  color:white;
  overflow:hidden;
  transition:0.4s;
}

/* SUPER DARK MODE */
body.dark-mode{
  background:#000000;
  color:#00ffff;
}

/* FADE IN */
body{
  animation:fadeInBody 1.2s ease;
}
@keyframes fadeInBody{
  from{opacity:0;}
  to{opacity:1;}
}

/* FULLSCREEN CONTAINER */
.container{
  position:relative;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  text-align:center;
  z-index:2;
}

/* CYBER TEXT */
h1{
  font-size:40px;
  color:#00ffff;
  text-shadow:0 0 20px #00ffff;
}

p{
  opacity:0.8;
  margin-top:10px;
}

/* TOGGLE */
.toggle{
  margin-top:20px;
}

/* ICON HOVER */
.social{
  margin-top:25px;
  display:flex;
  gap:20px;
}

.social a{
  font-size:28px;
  text-decoration:none;
  color:#00ffff;
  transition:0.3s;
}

.social a:hover{
  transform:scale(1.2);
  text-shadow:0 0 20px #00ffff;
}

/* BACKGROUND ANIMATION */
.background{
  position:fixed;
  width:100%;
  height:100%;
  top:0;
  left:0;
  z-index:1;
  overflow:hidden;
}

.background span{
  position:absolute;
  color:#00ffff33;
  font-size:20px;
  animation:float 20s linear infinite;
}

@keyframes float{
  from{transform:translateY(100vh);}
  to{transform:translateY(-10vh);}
}

/* ENTER SCREEN */
#enterScreen{
  position:fixed;
  width:100%;
  height:100%;
  background:black;
  display:flex;
  justify-content:center;
  align-items:center;
  z-index:9999;
  cursor:pointer;
}

#enterScreen h1{
  font-family:monospace;
  animation:glow 1.5s infinite alternate;
}

@keyframes glow{
  from{opacity:0.6;}
  to{opacity:1;}
}

/* RESPONSIVE */
@media(max-width:768px){
  h1{font-size:28px;}
  .social a{font-size:22px;}
}
</style>
</head>

<body>

<!-- TAP SCREEN -->
<div id="enterScreen">
  <h1>⚡ TAP TO ENTER CYBER MODE ⚡</h1>
</div>

<!-- BACKGROUND HARDWARE -->
<div class="background">
  <span style="left:10%">VGA</span>
  <span style="left:20%">SSD</span>
  <span style="left:30%">MONITOR</span>
  <span style="left:40%">KEYBOARD</span>
  <span style="left:50%">MOUSE</span>
  <span style="left:60%">POWER SUPPLY</span>
  <span style="left:70%">MOTHERBOARD</span>
  <span style="left:80%">CPU</span>
  <span style="left:90%">RAM</span>
</div>

<!-- CONTENT -->
<div class="container">
  <h1>Rizqi Evan</h1>
  <p>Hardware Mode Activated</p>

  <div class="toggle">
    <label>
      <input type="checkbox" id="themeSwitch"> Mode Gelap / Mode Terang
    </label>
  </div>

  <div class="social">
    <a href="#">Instagram</a>
    <a href="#">WhatsApp</a>
    <a href="#">GitHub</a>
  </div>
</div>

<!-- MUSIC -->
<audio id="bgMusic" loop>
  <source src="music.mp3" type="audio/mpeg">
</audio>

<script>

/* DARK MODE SAVE */
const themeSwitch = document.getElementById("themeSwitch");

if(localStorage.getItem("theme")==="dark"){
  document.body.classList.add("dark-mode");
  themeSwitch.checked=true;
}

themeSwitch.addEventListener("change",()=>{
  document.body.classList.toggle("dark-mode");
  localStorage.setItem("theme",
    document.body.classList.contains("dark-mode")?"dark":"light"
  );
});

/* TAP TO ENTER + PLAY MUSIC */
const music = document.getElementById("bgMusic");
music.volume = 0.4;

const enterScreen = document.getElementById("enterScreen");

enterScreen.addEventListener("click", () => {
  music.play().then(()=>{
    enterScreen.style.opacity="0";
    setTimeout(()=>{
      enterScreen.style.display="none";
    },500);
  });
});

</script>

</body>
</html>
